<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treino de Discursiva · Delegado PC-BA</title>
<style>
:root{--bg:#f6f4ef;--papel:#fff;--tinta:#1f2433;--suave:#5d6577;--linha:#ddd8cc;--azul:#24508f;--azul2:#e7eef9;--verde:#1f7a4d;--verde2:#e3f3ea;--vermelho:#b3261e;--vermelho2:#fbe9e7;--ouro:#9a6b00;--ouro2:#fff4d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
header{background:var(--azul);color:#fff;padding:14px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:0 3px 14px #172b491f}
header h1{margin:0;font-size:20px}header small{opacity:.85}
nav.abas{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}nav.abas button{background:transparent;border:1px solid #ffffff66;color:#fff;border-radius:999px;padding:7px 14px;min-height:40px;font:inherit;cursor:pointer;transition:background-color .15s,border-color .15s}nav.abas button:hover{background:#ffffff1a;border-color:#fff}nav.abas button.on{background:#fff;color:var(--azul);font-weight:700}nav.abas button:focus-visible{outline:3px solid #fff;outline-offset:3px}
main{max-width:1220px;margin:0 auto;padding:22px}
.card{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:20px 22px;margin-bottom:16px;box-shadow:0 3px 14px #1f24330a}
h2{margin:.2em 0 .55em;font-size:23px;line-height:1.3}h3{margin:1em 0 .45em;font-size:18px;line-height:1.35}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--linha);padding:9px 10px;text-align:left;vertical-align:top;line-height:1.55}th{background:#eef1f6;color:#26384f;font-weight:700}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.item{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s}.item:hover,.item:focus-visible{border-color:var(--azul);box-shadow:0 4px 14px #24508f16}
.item b{display:block;font-size:17px;line-height:1.4;margin-bottom:4px}.item small{color:var(--suave);line-height:1.5}.selo{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;margin-top:8px}
.feito{background:var(--verde2);color:var(--verde)}.pend{background:#eee;color:#666}
.bt{background:var(--papel);border:1px solid var(--linha);border-radius:9px;padding:9px 14px;min-height:40px;font:inherit;cursor:pointer;transition:background-color .15s,border-color .15s,box-shadow .15s}.bt:not(:disabled):hover{border-color:var(--azul);box-shadow:0 2px 8px #24508f16}.bt:focus-visible{outline:3px solid #24508f66;outline-offset:2px}.bt.pri{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:700}.bt.pri:not(:disabled):hover{background:#193e73}.bt.ok{background:var(--verde);border-color:var(--verde);color:#fff}.bt:disabled{opacity:.5;cursor:default}
.linha-bts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.enun{background:#f4f6f9;border:1px solid #e0e5ec;border-left:4px solid #7b8797;padding:14px 16px;border-radius:8px;white-space:pre-wrap;line-height:1.75}
.orient{background:#edf3fc;border:1px solid #d6e2f4;border-left:4px solid var(--azul);padding:14px 16px;border-radius:8px;line-height:1.7}
.modelo{background:#edf7f1;border:1px solid #d4eadc;border-left:4px solid var(--verde);padding:14px 16px;border-radius:8px;white-space:pre-wrap;font-family:Georgia,serif;line-height:1.8}
.mnem{background:#fff8e7;border:1px solid #f0e2bb;border-left:4px solid var(--ouro);padding:14px 16px;border-radius:8px;line-height:1.7}
.alerta{background:#fff1ef;border:1px solid #f2d5d1;border-left:4px solid var(--vermelho);padding:14px 16px;border-radius:8px;line-height:1.7}
.arts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.arts span{background:#fff;border:1px solid var(--azul);color:var(--azul);border-radius:999px;padding:2px 10px;font-size:14px}
textarea{width:100%;min-height:180px;border:1px solid #c8d0dc;border-radius:9px;padding:14px;font:16px/1.75 Georgia,serif;resize:vertical;background:#fff}textarea:focus{outline:3px solid #24508f33;border-color:var(--azul)}
.cont{font-size:14px;color:var(--suave);margin-top:4px}.cont.ruim{color:var(--vermelho);font-weight:700}
.passos{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 18px;padding-bottom:14px;border-bottom:1px solid #e8ebf0}.passos button{border:1px solid var(--linha);background:#fff;border-radius:8px;padding:7px 11px;min-height:36px;font-size:13px;font-weight:600;cursor:pointer}.passos button:hover{border-color:var(--azul)}.passos button.at{background:var(--azul);color:#fff;border-color:var(--azul);box-shadow:0 2px 8px #24508f30}.passos button.ok{background:var(--verde2);border-color:#b9ddc7;color:var(--verde)}
.check label{display:block;padding:3px 0}
.flash{text-align:center;padding:28px 22px;background:#f8f9fb;border:1px solid #e4e8ee;border-radius:12px;margin:18px 0}.flash .p{font-size:20px;font-weight:700;line-height:1.55;max-width:850px;margin:0 auto}.flash .r{font-size:18px;line-height:1.65;margin-top:16px}.flash .a{color:var(--azul);font-weight:700;margin-top:8px}
.flash input{font:inherit;padding:8px;border:1px solid var(--linha);border-radius:8px;width:min(520px,100%);margin-top:12px}
.placar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.placar div{background:#f7f9fc;border:1px solid #dfe5ee;border-radius:11px;padding:12px 15px;line-height:1.45}.placar b{font-size:22px;display:block;color:var(--azul);margin-top:3px}
.caixas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.caixas div{background:#f7f9fc;border:1px solid #dfe5ee;border-radius:10px;padding:12px;text-align:center;color:var(--suave)}.caixas b{display:block;font-size:22px;color:var(--tinta);margin-top:4px}
.peca-final{white-space:pre-wrap;font-family:Georgia,serif;background:#fffef8;border:1px solid var(--linha);padding:14px;border-radius:8px}
.modos{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}.modos button{border:1px solid var(--azul);background:#fff;color:var(--azul);border-radius:999px;padding:6px 14px;font:inherit;cursor:pointer}.modos button.on{background:var(--azul);color:#fff;font-weight:700}
mark{background:#fff0a8;padding:0 2px;border-radius:3px}
.op{display:block;width:100%;text-align:left;margin:6px 0}.op.certa{background:var(--verde2);border-color:var(--verde)}.op.errada{background:var(--vermelho2);border-color:var(--vermelho)}
.fb{margin:4px 0 10px;padding:8px 12px;border-radius:6px}.fb.ok{background:var(--verde2)}.fb.no{background:var(--vermelho2)}
details.lei{border:1px solid var(--linha);border-radius:8px;margin:6px 0;background:#fff}details.lei summary{cursor:pointer;padding:7px 10px;color:var(--azul);font-weight:600}
.leitxt{white-space:pre-wrap;font:15px/1.6 Georgia,serif;padding:4px 12px 10px}.leitxt small{color:var(--suave);font:12px "Segoe UI",sans-serif}.leifonte{font-size:12px;color:var(--suave);padding:0 12px 8px}
.n26{color:var(--vermelho);font-weight:700}.arts span[data-art]{cursor:pointer}.arts span[data-art]:hover{background:var(--azul2)}
.lk{color:#5a2ca0;font-weight:700;text-decoration:underline dotted 2px;text-underline-offset:3px;cursor:pointer;border-radius:4px}.lk:hover,.lk:focus{background:#efe7fb;outline:none}
.lk-c{color:#0f5d3a;text-decoration-style:dashed}.lk-s{color:#8a4b00}
.dolig{margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.dolig b{font-size:13px;color:var(--suave);text-transform:uppercase;letter-spacing:.04em}
.dolig button{border:1px solid #cdbfe9;background:#f6f1fd;color:#4a2590;border-radius:999px;padding:5px 12px;font-weight:700;cursor:pointer}.dolig button:hover{background:#e9dffa}
#sobre{position:fixed;inset:0;z-index:90;background:rgba(15,27,48,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
#sobre[hidden]{display:none}
#sobre .caixa{background:#fff;color:#1c2230;max-width:860px;width:100%;border-radius:14px;padding:18px 22px 22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
#sobre .topo{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-4vh;background:#fff;padding:6px 0;border-bottom:1px solid var(--linha);margin-bottom:6px}
#sobre .topo h2{margin:0;font-size:20px}#sobre .topo button{border:0;border-radius:10px;background:#0f1b30;color:#fff;font-weight:700;padding:8px 14px;cursor:pointer}
.tema{border-top:1px solid var(--linha);padding-top:10px;margin-top:12px}.rot{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);margin-top:10px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px;margin:8px 0}.nums button{border:1px solid var(--linha);background:#fff;border-radius:6px;padding:5px 0;font:13px "Segoe UI",sans-serif;cursor:pointer}.nums button.at{outline:2px solid var(--azul)}.nums button.resp{background:var(--azul2);border-color:var(--azul)}.nums button.cer{background:var(--verde2);border-color:var(--verde)}.nums button.err{background:var(--vermelho2);border-color:var(--vermelho)}
.op:disabled{opacity:1;cursor:default;color:var(--tinta)}.op.marcada{background:var(--azul2);border-color:var(--azul);font-weight:600}.sq p{margin:.45em 0}pre.tab{overflow-x:auto;font:13px/1.45 Consolas,monospace;background:#fafaf7;border:1px solid var(--linha);border-radius:6px;padding:8px;white-space:pre}
img.fig{display:block;max-width:100%;margin:10px auto;border:1px solid var(--linha);border-radius:6px}.com{background:#fffef8;border:1px solid var(--linha);border-left:4px solid var(--ouro);padding:8px 14px;border-radius:6px;margin-top:10px}
/* Simulados: leitura e alternativas no padrão da Trilha (index.html, V4) — 05/11/2026, pedido do titular */
.sq{--zq:1}.sq h3{font-size:calc(17px * var(--zq))}
.sq .texto,.sq .com{font-size:calc(16px * var(--zq));line-height:1.8;text-align:justify;text-justify:inter-word;hyphens:auto;overflow-wrap:break-word}
.sq .texto p,.sq .com p{margin:.55em 0}
.sq .com{background:#f7f9fc;border:1px solid #d7dfeb;border-left:4px solid var(--azul);border-radius:12px;padding:0 18px 16px;margin-top:18px;box-shadow:0 6px 18px #1f24330c}
.sq .com>.rot{color:var(--azul);font-size:12px;letter-spacing:.09em;margin:0 0 12px;padding:14px 0 10px;border-bottom:1px solid var(--linha)}
.sq .com p{text-align:left;line-height:1.75}
.sq .com .destaque-chave{font-weight:750;color:#1b3558}
.sq .com .destaque-excecao{font-weight:750;color:#a3211a;background:#fff0ee;border-radius:3px;padding:0 2px}
.bl-item{padding-left:1.4em;text-indent:-1.4em}.bl-centro{text-align:center!important;font-weight:700;margin-top:1em!important}
.bl-conta{text-align:center!important;font-family:Cambria,"Cambria Math",Georgia,serif;background:#f7f6f1;border-radius:6px;padding:4px 8px}
.bl-formula{text-align:center;font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.05em;line-height:1.6;background:#f7f6f1;border-radius:8px;padding:8px 10px;margin:10px 0}
.bl-tab{overflow-x:auto;margin:12px 0;border:1px solid var(--linha);border-radius:8px}.bl-tab table{font-size:.9em;line-height:1.5;text-align:left}.bl-tab th{background:#efeadf}.bl-tab td,.bl-tab th{text-align:left;hyphens:manual}
.sq .com .bl-tab{border-color:#d7dfeb;border-radius:10px;background:#fff}
.sq .com .bl-tab table{font-size:.92em;line-height:1.55}
.sq .com .bl-tab th{background:#eef2f8;color:#26384f;font-weight:700}
.sq .com .bl-tab td,.sq .com .bl-tab th{padding:10px 12px;border-bottom:1px solid #e4e9f0}
.sq .com .bl-tab tbody tr:nth-child(even){background:#f8f9fc}
.sq .com .bl-tab tr:last-child td{border-bottom:0}
.sq .com .bl-formula,.sq .com .bl-conta{border:1px solid #e5e9ef;color:#26384f}
.op-hint{background:var(--azul2);color:var(--azul);border-radius:10px;padding:8px 12px;margin:14px 0 10px;font-size:13px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.option-row{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:stretch}.option-row.sem-tesoura{grid-template-columns:minmax(0,1fr)}
.sq .op{display:flex;gap:12px;align-items:flex-start;margin:0;padding:12px 14px;border-radius:12px;font-size:calc(16px * var(--zq));line-height:1.7;text-align:left}
.sq .op .letra{flex:0 0 34px;height:34px;border:1px solid var(--linha);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff}
.sq .op .otx{min-width:0;text-align:justify;hyphens:auto;overflow-wrap:break-word}
.sq .op.marcada .letra{background:var(--azul);border-color:var(--azul);color:#fff}.sq .op.certa .letra{background:var(--verde);border-color:var(--verde);color:#fff}.sq .op.errada .letra{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.scissor{background:#fff;border:1px solid var(--linha);border-radius:12px;color:var(--suave);font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit}
.scissor:hover{border-color:var(--azul);background:var(--azul2);color:var(--azul)}.scissor:focus-visible,.sq .op:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.scissor .cut-label{font-size:11px;font-weight:800}
.option-row.eliminated .op{opacity:.55;background:#f3f1ec}.option-row.eliminated .otx{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--vermelho)}
.option-row.eliminated .scissor{background:var(--vermelho2);color:var(--vermelho);border-color:var(--vermelho)}
.aviso-sim{min-height:1.2em;font-size:13px;color:var(--vermelho);font-weight:700}
.zoomq{display:inline-flex;gap:4px;align-items:center;margin-left:auto}.zoomq .bt{padding:4px 10px}
/* Comentário em QUADROS (07/11/2026, pedido do titular): um quadro por função, exceção em vermelho, chave em negrito */
.cm{display:flex;flex-direction:column;gap:12px}
.cm-q{--cor:#24508f;--tinta-q:#1b3f73;--fundo-q:#edf3fc;background:#fff;border:1px solid #e3e8f0;border-left:4px solid var(--cor);border-radius:14px;padding:0 16px 10px;box-shadow:0 2px 10px #1f24330a;overflow:hidden}
.cm-q>.cm-rot{display:flex;align-items:center;gap:6px;margin:0 -16px 8px;padding:9px 16px;background:var(--fundo-q);color:var(--tinta-q);font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.cm-q p{margin:.5em 0}
.cm-lei{--cor:#6b4fa0;--tinta-q:#4b3477;--fundo-q:#f3effa}
.cm-juris{--cor:#9a6b00;--tinta-q:#6e4c00;--fundo-q:#fff6df}
.cm-atencao,.cm-resumo-exc{--cor:#b3261e;--tinta-q:#8f1d17;--fundo-q:#fdeceb}
.cm-alts{--cor:#5d6577;--tinta-q:#3b4352;--fundo-q:#f2f4f7}
.cm-regra{--cor:#1f7a4d;--tinta-q:#145c39;--fundo-q:#e8f5ee}
.cm-pegadinha{--cor:#c2410c;--tinta-q:#8a2e08;--fundo-q:#fff1e6}
.cm-resumo-exc ul,.cm-exc-lista{margin:.4em 0;padding-left:1.2em}.cm-resumo-exc li,.cm-exc-lista li{margin:.3em 0}
.cm-exc-lista li{color:#8f1d17}
.cm-chave{font-weight:750;color:#13294b}
.cm-exc{color:#a3211a;background:#fdecea;border-radius:4px;padding:0 .15em;box-decoration-break:clone;-webkit-box-decoration-break:clone;font-weight:600}
.cm-exc strong{font-weight:800}.cm-exc .cm-chave{color:#8f1d17}
.cm-alt{background:#fafbfc;border:1px solid #e4e8ee;border-radius:12px;padding:10px 12px;margin:8px 0;color:#3b4352}
.cm-alt-cab{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;margin-bottom:2px}
.cm-letra{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;background:#e8ebf0;color:#3b4352;font-weight:800;text-transform:uppercase}
.cm-sep{color:#525a6b;font-size:.9em}.cm-sep:empty{display:none}
.cm-ver{font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.04em}
.cm-ver-ok{background:#dff1e7;color:#145c39}.cm-ver-no{background:#eef0f3;color:#525a6b}
.cm-gab{margin-left:auto;background:#1f7a4d;color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
.cm-alt-gab{background:#eef8f2;border-color:#a9d8bb;border-left:4px solid #1f7a4d;color:var(--tinta);box-shadow:0 3px 12px #1f7a4d14}
.cm-alt-gab .cm-letra{background:#1f7a4d;color:#fff}
.cm-assert.cm-ok .cm-letra{background:#dff1e7;color:#145c39}
.cm-alt-corpo .bl-item{padding-left:0;text-indent:0}.cm-alt-corpo p:first-child{margin-top:.2em}
.cm-cit{margin:8px 0;border:1px solid #e6e0f2;border-radius:10px;background:#fbfaff;overflow:hidden}.cm-cit figcaption{padding:6px 12px;font-size:13px;font-weight:800;color:#4b3477;background:#f3effa}
.cm-cit blockquote{margin:0;padding:8px 14px 10px;font:15.5px/1.7 Georgia,serif;color:var(--tinta)}
.cm-jur{border:1px solid #f0e2bb;border-radius:10px;background:#fffcf3;padding:8px 12px;margin:8px 0}.cm-jur-fonte{font-size:13px;color:#6e4c00}
.cm-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.cm-tags span{background:#e7eef9;color:#1b3f73;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700}
/* Comentário aprofundado do Pente Fino e da Revisão (09/11/2026, pedido do titular): o "por quê" em destaque,
   o erro lado a lado com o certo, o aprofundamento em texto corrido, o exemplo e a linha para memorizar. */
.pf-com{gap:14px}.pf-com p{line-height:1.68}
.pf-com .cm-porque{--cor:#24508f;border-left-width:6px;background:linear-gradient(180deg,#f7faff,#fff 70%)}.pf-com .cm-porque p{font-size:1.04em;color:#13294b}
.cm-correcao{--cor:#5d6577;--tinta-q:#3b4352;--fundo-q:#f2f4f7}
.cm-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}
.cm-cmp>div{border-radius:10px;padding:8px 12px;border:1px solid}.cm-cmp b{display:block;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.cm-cmp-erro{background:#fdf0ef;border-color:#f3c9c5!important;color:#5c1611}.cm-cmp-erro b{color:#8f1d17}
.cm-cmp-certo{background:#eef8f2;border-color:#b5dcc4!important;color:#123f29}.cm-cmp-certo b{color:#145c39}
.cm-aprof{--cor:#0f6e6e;--tinta-q:#0b5252;--fundo-q:#e6f4f4}.cm-aprof p{margin:.55em 0}
.cm-exemplo{--cor:#4a5878;--tinta-q:#323d55;--fundo-q:#eef1f7}.cm-exemplo p{font-style:italic}
.cm-memo{display:flex;gap:10px;align-items:flex-start;background:#1b3f73;color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 3px 14px #1b3f7333}
.cm-memo b{flex:none;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:#cfe0ff;padding-top:2px}.cm-memo span{font-weight:700;line-height:1.5}
.cm-memo .cm-chave{color:#fff;text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.cm-cmp{grid-template-columns:1fr}.cm-memo{flex-direction:column;gap:2px}}
/* ---------- Pente Fino ---------- */
.pf-topo{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.pf-topo h2{margin:0}
.pf-discs{display:flex;flex-wrap:wrap;gap:6px}.pf-discs button{border:1px solid var(--azul);background:#fff;color:var(--azul);border-radius:999px;padding:6px 14px;min-height:40px;font:inherit;cursor:pointer}.pf-discs button.on{background:var(--azul);color:#fff;font-weight:700}
.pf-rodadas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:14px 0}
.pf-rod{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:2px solid var(--linha);border-radius:14px;padding:14px 16px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.pf-rod:hover:not(:disabled){border-color:var(--azul);box-shadow:0 4px 14px #24508f16}.pf-rod.on{border-color:var(--azul);background:#f5f8fd;box-shadow:0 4px 14px #24508f1f}
.pf-rod b{font-size:17px}.pf-rod small{color:var(--suave)}.pf-rod:disabled{cursor:not-allowed;background:#f4f4f2;color:#525a6b}.pf-rod .pf-cad{font-weight:700;color:#8f1d17}
.pf-barra{height:10px;background:#e8ebf0;border-radius:999px;overflow:hidden}.pf-barra i{display:block;height:100%;background:linear-gradient(90deg,#24508f,#3d73c2);border-radius:999px}
.pf-barra.ok i{background:linear-gradient(90deg,#1f7a4d,#2f9d66)}
.pf-pontos summary{cursor:pointer;font-weight:700;color:var(--azul);padding:6px 0}
.pf-ponto{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--linha);border-radius:10px;padding:8px 12px;margin:6px 0;font:inherit;color:inherit;cursor:pointer}
.pf-ponto:hover{border-color:var(--azul)}.pf-ponto.at{border-color:var(--azul);background:#f5f8fd}.pf-ponto span{font-size:14px;line-height:1.4}.pf-ponto small{text-align:right;color:var(--suave);font-weight:700}
.pf-item{scroll-margin-top:12px;border:1px solid #d7dfeb;border-radius:16px;padding:18px 20px;background:linear-gradient(180deg,#fbfcfe,#fff);box-shadow:0 6px 18px #1f24330c}
.pf-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--suave)}.pf-meta .selo{margin:0;background:var(--azul2);color:#1b3f73}
.pf-assertiva{font-size:19px;line-height:1.65;font-weight:600;margin:12px 0 16px;color:var(--tinta)}
.pf-ce{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pf-ce button{min-height:64px;border-radius:14px;font:800 18px/1.2 "Segoe UI",system-ui,sans-serif;letter-spacing:.06em;cursor:pointer;border:2px solid;transition:transform .1s,box-shadow .15s}
.pf-ce button:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 16px #1f243320}
.pf-ce [data-pfr="C"]{background:#eef8f2;border-color:#1f7a4d;color:#145c39}.pf-ce [data-pfr="E"]{background:#fdeceb;border-color:#b3261e;color:#8f1d17}
.pf-ce button:disabled{cursor:default;opacity:.55}.pf-ce button.escolhida{opacity:1;box-shadow:inset 0 0 0 3px currentColor}
.pf-ce button:focus-visible,.pf-rod:focus-visible,.pf-ponto:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.pf-fb{margin:14px 0 10px;padding:12px 14px;border-radius:12px;font-weight:700}.pf-fb.ok{background:var(--verde2);color:#145c39}.pf-fb.no{background:var(--vermelho2);color:#8f1d17}
.pf-confirma{background:#fff8e7;border:1px solid #f0e2bb;border-radius:12px;padding:12px 14px;margin-top:10px}
.pf-vazio{background:#f4f6f9;border:1px dashed #b9c2d0;border-radius:14px;padding:22px;text-align:center;color:#3b4352}
.pf-fim{background:var(--verde2);border:1px solid #b9ddc7;border-radius:14px;padding:14px 16px;margin:12px 0;color:#145c39}
.pf-atalhos{font-size:13px;color:var(--suave);margin-top:10px}
@media(max-width:700px){header{padding:12px}main{padding:12px}.card{padding:16px}.caixas{grid-template-columns:repeat(3,1fr)}.option-row{grid-template-columns:minmax(0,1fr) 58px}.scissor .cut-label{font-size:9px}.sq .com{padding:0 12px 12px}.sq .com .bl-tab td,.sq .com .bl-tab th{padding:8px 9px}
 .sq .com{padding:0 8px 10px}.cm-q{padding:0 10px 8px;border-radius:12px}.cm-q>.cm-rot{margin:0 -10px 8px;padding:8px 10px}.cm-alts{padding:0 6px 6px}.cm-alts>.cm-rot{margin:0 -6px 6px}.cm-alt{padding:8px 9px;margin:6px 0}
 .pf-item{padding:14px}.pf-assertiva{font-size:17px}.pf-ponto{grid-template-columns:minmax(0,1fr) 54px}.pf-ponto .pf-barra{grid-column:1/-1;grid-row:2}}

<body>
<header><h1>⚖️ Treino de Discursiva</h1><small>Delegado PC-BA 2026 · Instituto AOCP · peça + estudos de caso + memorização da lei</small>
<nav class="abas" id="abas"></nav></header>
<main id="tela"></main>
<div id="sobre" hidden role="dialog" aria-modal="true" aria-labelledby="sobreTit"><div class="caixa"><div class="topo"><h2 id="sobreTit"></h2><button id="sobreX">✕ Fechar (Esc)</button></div><div id="sobreCorpo"></div></div></div>
<script src="conteudo.js"></script>
<script src="leis.js"></script>
<script src="pecas_complementares.js"></script>
<script src="conducao.js"></script>
<script src="estudo.js"></script>
<script src="artigos.js"></script>
<script src="blocos.js"></script>
<script src="simulados_delta.js" data-local="terceiro"></script>
<script src="pente_fino_cpc.js" data-opcional="1"></script>
<script src="pente_fino_civ.js" data-opcional="1"></script>
<script src="pente_fino_mle.js" data-opcional="1"></script>
<script src="pente_fino_cri.js" data-opcional="1"></script>
<script src="pente_fino_cpp.js" data-opcional="1"></script>
<script src="pente_fino_pen.js" data-opcional="1"></script>
<script src="pente_fino_lpe.js" data-opcional="1"></script>
<script src="pente_fino_inf.js" data-opcional="1"></script>
<script src="revisao_nfpss.js" data-local="terceiro"></script>
<script>
/* Treino de Discursiva (02/11/2026, pedido do titular): fazer a peça e os estudos de caso PASSO A PASSO, sob orientação,
   e memorizar os artigos de cada um (cartões com repetição espaçada + Certo/Errado para a objetiva).
   Tudo fica no navegador (localStorage); o conteúdo está em conteudo.js. */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHAVE='disc-pcba:v1';
let st={pecas:{},casos:{},cartoes:{},hist:[]};try{st=Object.assign(st,JSON.parse(localStorage.getItem(CHAVE)||'{}'))}catch(e){}
const salvar=()=>{try{localStorage.setItem(CHAVE,JSON.stringify(st))}catch(e){}};
const hoje=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const DIA=864e5,INTERVALO=[0,1,3,7,15,30];
/* linhas manuscritas: ~72 caracteres por linha da folha de resposta (estimativa) */
const LARG=72;const linhas=t=>String(t||'').split('\n').reduce((n,l)=>n+Math.max(1,Math.ceil(l.length/LARG)),0)-(t?0:1);

/* ---------- todos os cartões, com id estável ---------- */
const CARTOES=[];
for(const p of PECAS)p.cards.forEach((c,i)=>CARTOES.push({...c,id:p.id+'#'+i,orig:p.titulo}));
for(const c of CASOS)c.cards.forEach((k,i)=>CARTOES.push({...k,id:c.id+'#'+i,orig:c.titulo}));
if(typeof LEIS!=='undefined')for(const l of LEIS)l.cards.forEach((c,i)=>CARTOES.push({...c,id:l.id+'#'+i,orig:l.titulo}));
const cx=id=>st.cartoes[id]||{caixa:0,prox:0};

/* ---------- passos de uma peça ---------- */
function passosDe(p){
 if(p.tipo==='inquerito')return[
  {t:'Cabeçalho',orient:'Identifique a unidade policial e o número da portaria. Sem nomes do candidato.',arts:['Edital PC-BA, item 7.2.11.3'],check:['Unidade policial com lacunas','Nada que identifique o candidato'],modelo:p.cabecalho||'POLÍCIA CIVIL DO ESTADO DA BAHIA\nDelegacia Territorial de …\nPortaria nº …/…'},
  {t:'Preâmbulo',orient:p.pre_orient||'Quem instaura, com qual atribuição e fundamento (art. 5º, I, CPP: de ofício).',arts:p.pre_arts,check:p.pre_check||['Citei a atribuição constitucional e a Lei 12.830','Fundamentei a instauração de ofício (art. 5º, I)'],modelo:p.preambulo},
  {t:'Dos fatos',orient:'Narre só o que o enunciado traz, no condicional ("teria"), sem juízo definitivo.',arts:[],check:['Narrei sem inventar dados','Usei o condicional (fase de apuração)'],modelo:p.fatos},
  ...p.direito,
  {...BASE.fecho,orient:'Local, data e "Delegado de Polícia Civil".',modelo:'…/BA, … de … de ….\n\nDelegado de Polícia Civil'}];
 return[
  {...BASE.enderecamento,modelo:p.enderecamento||'EXCELENTÍSSIMO(A) SENHOR(A) JUIZ(ÍZA) DE DIREITO DA … VARA CRIMINAL DA COMARCA DE …/BA\n(ou: JUIZ DAS GARANTIAS, onde implantado)'},
  BASE.referencia,
  {t:'Preâmbulo',orient:'Quem representa, com que atribuição, com que fundamento legal, pelo quê e contra quem. É aqui que o examinador vê se você sabe A PEÇA.',arts:p.pre_arts,check:['Usei o verbo correto (REPRESENTAR)','Citei os artigos do pedido','Identifiquei o representado (qualificação nos autos)'],modelo:p.preambulo},
  {t:'Dos fatos',orient:'Síntese objetiva SÓ com o que o enunciado traz. Nunca invente dados. Tipificação completa: (1) consumado ou tentado (art. 14, II)? (2) qualificadora, majorante, agravante? (3) vários agentes: concurso de pessoas (art. 29), associação (art. 288) ou orcrim (Lei 12.850, art. 2º)? (4) vários crimes: concurso material (69), formal (70) ou continuado (71)? (5) adolescente: ato infracional análogo.',arts:['CP, arts. 14, 29, 69, 70 e 71','CP, art. 288; Lei 12.850/13, art. 2º'],check:['Síntese curta e fiel ao enunciado','Nenhum dado inventado','Indiquei o IP de origem','Tipifiquei completo (tentativa, qualificadora/majorante, concurso de pessoas e de crimes)'],modelo:p.fatos},
  ...(p.dirfund?[{t:'Dos fundamentos: não há direito fundamental absoluto',orient:'Diga QUAL direito fundamental a medida relativiza e o inciso do art. 5º da CF: liberdade (LXI), casa (XI), intimidade e vida privada (X), comunicações (XII), propriedade (XXII). A relativização é excepcional e está sob reserva de jurisdição.',arts:['CF, art. 5º, '+p.dirfund.inc],check:['Nomeei o direito fundamental relativizado','Citei o inciso do art. 5º ('+p.dirfund.inc+')','Disse que a medida está sob reserva de jurisdição'],modelo:'DOS FUNDAMENTOS — DA INEXISTÊNCIA DE DIREITOS FUNDAMENTAIS ABSOLUTOS\nA relativização de direito fundamental é medida excepcional, sujeita à reserva de jurisdição. Contudo, a garantia da '+p.dirfund.bem+' (CF, art. 5º, '+p.dirfund.inc+') não pode servir de escudo para a prática de ilícitos, em detrimento da segurança pública e da ordem pública, igualmente tuteladas: não há direito fundamental absoluto, admitindo-se sua restrição excepcional, por ordem judicial fundamentada.'}]:[]),
  ...p.direito,
  {t:'Dos pedidos',orient:'Pedidos NUMERADOS: o principal, os acessórios (mandado e registro no BNMP — art. 289-A; acesso a dados…), oitiva do MP, decisão sem intimação prévia do investigado (art. 282, § 3º), sigilo e urgência. Nas prisões, lembre a revisão a cada 90 dias (art. 316, parágrafo único). A banca pontua CADA pleito.',arts:['CPP, art. 282, § 3º (decisão sem intimação prévia)','CPP, art. 289-A (registro do mandado no BNMP)','CPP, art. 316, parágrafo único (revisão a cada 90 dias)'],check:p.pedidos_check,modelo:p.pedidos},
  BASE.fecho];
}

/* ---------- abas ---------- */
const ABAS=[['edital','🗺️ Edital'],['pecas','📜 Peças'],['casos','✍️ Estudos de caso'],['simulados','📝 Simulados'],['pente','🔍 Pente Fino'],['revisao','📚 Revisão'],['memoria','🧠 Memorizar'],['progresso','📊 Progresso']];
let aba='edital';
const marcarAba=a=>{aba=a;$('abas').innerHTML=ABAS.map(([k,n])=>`<button class="${k===a?'on':''}" data-aba="${k}">${n}</button>`).join('')};
function ir(a){aba=a;$('abas').innerHTML=ABAS.map(([k,n])=>`<button class="${k===a?'on':''}" data-aba="${k}">${n}</button>`).join('');({edital,pecas:listaPecas,casos:listaCasos,simulados:listaSimulados,pente:()=>pfModo('pente'),revisao:()=>pfModo('revisao'),memoria:memorizar,progresso})[a]();scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-aba]');if(b)ir(b.dataset.aba)});

function edital(){
 const due=CARTOES.filter(c=>cx(c.id).prox<=Date.now()).length;
 $('tela').innerHTML=`<div class="card"><h2>A discursiva de Delegado PC-BA 2026</h2><p>Regras conferidas no <b>Edital SAEB nº 02/2026</b> (o PDF está na pasta DELEGADO BA). Treine sempre dentro delas.</p>
 <table><tr><th>Item</th><th>Regra</th><th>Edital</th></tr>${EDITAL.regras.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table></div>
 <div class="card"><h2>Como usar</h2><ol><li><b>Peças</b>: escolha uma e faça passo a passo — escreva cada parte, depois compare com o modelo e marque o checklist (é como a banca corrige).</li><li><b>Estudos de caso</b>: responda em 10 a 25 linhas e corrija pelo espelho.</li><li>No fim de cada um, <b>memorize</b>: cartões com o artigo de cada regra, em repetição espaçada, e itens Certo/Errado — que servem também para a objetiva.</li><li>Volte todo dia à aba <b>Memorizar</b>: ${due} cartão(ões) para hoje.</li></ol>
 <div class="alerta"><b>Atenção:</b> a peça vale 60 dos 100 pontos e a nota mínima é 70 — a peça decide a discursiva. Assine sempre só "Delegado de Polícia Civil".</div></div>
 <div class="card"><h2>O que pode cair (Conhecimentos Específicos)</h2><p>${EDITAL.disciplinas.map(esc).join(' · ')}</p></div>`;
}

function listaPecas(){
 $('tela').innerHTML=`<div class="card"><h2>📜 Peças práticas</h2><p>Representações e peça de inquérito — os tipos que o edital admite (item 7.2.9.1). Comece pelas mais cobradas.</p></div><div class="grade">${PECAS.map(p=>{const s=st.pecas[p.id];return `<button class="item" data-peca="${p.id}"><b>${esc(p.titulo)}</b><small>${esc(p.freq)}</small><br><span class="selo ${s&&s.nota!=null?'feito':'pend'}">${s&&s.nota!=null?'Feita · '+s.nota+'/60':'A fazer'}</span></button>`}).join('')}</div>`;
}
function listaCasos(){
 $('tela').innerHTML=`<div class="card"><h2>✍️ Estudos de caso</h2><p>Cada um vale 20 pontos: 15 de conhecimento técnico e 5 de Língua Portuguesa. Entre 10 e 25 linhas.</p></div><div class="grade">${CASOS.map(c=>{const s=st.casos[c.id];return `<button class="item" data-caso="${c.id}"><b>${esc(c.titulo)}</b><small>${esc(c.disc)}</small><br><span class="selo ${s&&s.nota!=null?'feito':'pend'}">${s&&s.nota!=null?'Feito · '+s.nota+'/20':'A fazer'}</span></button>`}).join('')}</div>`;
}
document.addEventListener('click',e=>{const p=e.target.closest('[data-peca]');if(p)abrirPeca(p.dataset.peca);const c=e.target.closest('[data-caso]');if(c)abrirCaso(c.dataset.caso)});

/* ---------- peça passo a passo ---------- */
let peca=null,passo=0,modoPeca='escrever';
/* abre na condução enquanto ela não foi concluída (D-015: entender o caso ANTES de escrever) */
function abrirPeca(id,modo){marcarAba('pecas');peca=PECAS.find(p=>p.id===id);st.pecas[id]=st.pecas[id]||{txt:{},chk:{}};passo=0;
 const c=st.cond&&st.cond[id];modoPeca=modo||(typeof CONDUCAO!=='undefined'&&CONDUCAO[id]&&!(c&&c.fim)?'conduzir':'escrever');mostrarPeca()}
function mostrarPeca(){({conduzir:telaConduzir,escrever:telaPeca,estudo:telaEstudo})[modoPeca]()}
const barraModos=()=>`<div class="modos">${[['conduzir','🧭 Entender o caso'],['escrever','✍️ Escrever a peça'],['estudo','📚 Estudo completo']].filter(([k])=>k==='escrever'||(k==='conduzir'?typeof CONDUCAO!=='undefined'&&CONDUCAO[peca.id]:typeof ESTUDO!=='undefined'&&ESTUDO[peca.id])).map(([k,n])=>`<button class="${k===modoPeca?'on':''}" data-modo="${k}">${n}</button>`).join('')}</div>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-modo]');if(b&&peca){modoPeca=b.dataset.modo;mostrarPeca();scrollTo(0,0)}});

/* ---------- artigos: texto oficial (artigos.js, gerado do Planalto) ---------- */
const SIGLA={CF:'CF',CP:'CP',CPP:'CPP',ECA:'L8069',LEP:'L7210',CTN:'L5172'};
/* 'CPP, art. 313, I (…)' → 'CPP:313' — o mesmo parser do gerador */
function chaveDe(s){const m=String(s).match(/^(CF|CPP|CP|ECA|LEP|CTN|LC\s*(\d+)(?:\/\d+)?|Lei\s*([\d.]+)\/\d+)\s*,\s*arts?\.\s*(\d+)\s*(?:º|°|o)?\s*(-[A-Z])?/);if(!m)return null;
 const sig=m[2]?'LC'+m[2]:m[3]?'L'+m[3].replace(/\./g,''):SIGLA[m[1]];return sig+':'+m[4]+(m[5]||'')}
function rotulo(ref){if(/^(SUM|SV)/.test(ref)){const j=typeof JURIS!=='undefined'&&JURIS[ref];return ref.startsWith('SV')?'STF, Súmula Vinculante '+ref.slice(3):(j?j.tri:ref.split('-')[1])+', Súmula '+ref.split('-').pop()}
 const [sig,art,fr]=ref.split(':'),a=typeof ARTIGOS!=='undefined'&&ARTIGOS[ref],d=a?a.d:sig,n=/^\d$/.test(art)?art+'º':art;
 const f=!fr?'':fr==='pu'?', parágrafo único':fr.startsWith('§')?', § '+fr.slice(1)+(/^\d$/.test(fr.slice(1))?'º':''):', '+fr;return d+', art. '+n+f}
const notas=t=>esc(t).replace(/\((Reda[çc][ãa]o dada|Inclu[íi]d[oa]|Revogad[oa]|Vide|Vig[êe]ncia|Acrescid[oa]|Renumerad[oa])[^)]*\)/g,m=>`<small>${m}</small>`);
function leiHTML(ref,aberto){
 if(/^(SUM|SV)/.test(ref)){const j=typeof JURIS!=='undefined'&&JURIS[ref];return `<details class="lei" ${aberto?'open':''}><summary>⚖️ ${esc(rotulo(ref))}</summary><div class="leitxt">${j?esc(j.t):'(texto não está no acervo)'}</div><div class="leifonte">Texto oficial do acervo de súmulas.</div></details>`}
 const a=typeof ARTIGOS!=='undefined'&&ARTIGOS[ref];
 if(!a||a.falta)return `<details class="lei"><summary>📖 ${esc(rotulo(ref))}</summary><div class="leifonte">Texto oficial ainda não baixado. ${a&&a.u?`<a href="${esc(a.u)}" target="_blank" rel="noopener">Abrir no Planalto</a>`:''}</div></details>`;
 return `<details class="lei" ${aberto?'open':''}><summary>📖 ${esc(rotulo(ref))}${a.n26?' <span class="n26">⚠️ alterado em 2026</span>':''}</summary><div class="leitxt">${notas(a.t)}</div><div class="leifonte">Redação oficial do Planalto${a.b?', baixada em '+esc(a.b):''}. <a href="${esc(a.u)}" target="_blank" rel="noopener">Conferir na fonte</a></div></details>`}
/* toque num artigo da lista de um passo: abre o texto oficial logo abaixo */
document.addEventListener('click',e=>{const s=e.target.closest('[data-art]');if(!s)return;const alvo=s.closest('.arts').nextElementSibling;
 if(alvo&&alvo.classList.contains('lei-aberta')){alvo.innerHTML=alvo.dataset.ref===s.dataset.art?'':leiHTML(s.dataset.art,1);alvo.dataset.ref=alvo.innerHTML?s.dataset.art:''}});
const chips=arts=>arts&&arts.length?`<div class="arts">${arts.map(a=>{const k=chaveDe(a);return k&&typeof ARTIGOS!=='undefined'&&ARTIGOS[k]&&!ARTIGOS[k].falta?`<span data-art="${k}" title="Ler o texto oficial">📖 ${esc(a)}</span>`:`<span>${esc(a)}</span>`}).join('')}</div><div class="lei-aberta"></div>`:'';

/* ---------- condução: entender o caso antes de escrever ---------- */
function enunMarcado(p,pistas){let h=esc(p.enunciado);for(const x of pistas||[])h=h.split(esc(x)).join(`<mark>${esc(x)}</mark>`);return h}
function telaConduzir(){
 const C=CONDUCAO[peca.id];st.cond=st.cond||{};const c=st.cond[peca.id]=st.cond[peca.id]||{e:0,r:{}};const E=C.etapas,fim=c.e>=E.length;
 const barra=`<div class="passos">${E.map((x,i)=>`<button class="${i===c.e?'at':(i<c.e?'ok':'')}" data-etapa="${i}">${i+1}. ${esc(x.t)}</button>`).join('')}<button class="${fim?'at':''}" data-etapa="${E.length}">✔ Entendi</button></div>`;
 let corpo;
 if(fim){corpo=`<h3>Você entendeu o caso</h3><div class="mnem"><b>A lógica desta peça, em uma frase:</b> ${esc(E[0].logica)}</div>
  <p>Agora escreva a peça passo a passo — o roteiro é este: ${passosDe(peca).map(x=>esc(x.t)).join(' → ')}.</p>
  <div class="linha-bts"><button class="bt ok" id="irEscrever">✍️ Escrever a peça →</button><button class="bt" id="irEstudo">📚 Estudo completo</button><button class="bt" id="recond">Refazer a condução</button></div>`}
 else{const et=E[c.e];let tudoCerto=true;
  const qs=et.qs.map((q,qi)=>{const k=c.e+'.'+qi,esc0=c.r[k],certo=esc0!=null&&q.op[esc0][1];if(!certo)tudoCerto=false;

/* ---------- ligações: o que se escreve na peça abre o que o Estudo completo já tem (pedido do titular, 10/11/2026) ----------
   Artigo, súmula ou conceito citado na orientação, no modelo, no checklist ou na peça montada vira link; o link abre
   uma tela com a letra da lei (redação oficial) e os temas do Estudo completo que tratam daquilo. Nada é escrito de
   novo: a tela só mostra o que já está em estudo.js, artigos.js e no acervo de súmulas. */
const base=r=>String(r).split(':').slice(0,2).join(':');
const temasDaPeca=()=>typeof ESTUDO==='undefined'||!peca?[]:(ESTUDO[peca.id]||[]).map(k=>({k,...TEMAS[k]})).filter(t=>t.t);
const todosTemas=()=>typeof TEMAS==='undefined'?[]:Object.keys(TEMAS).map(k=>({k,...TEMAS[k]}));
/* temas que tratam de um artigo (base 'CPP:313') ou de uma súmula; primeiro os desta peça */
function temasDe(ref){const tem=t=>/^(SUM|SV)/.test(ref)?(t.jur||[]).includes(ref):(t.lei||[]).some(r=>base(r)===ref);
 const da=temasDaPeca().filter(tem);return da.length?da:todosTemas().filter(tem)}
const temArt=k=>(typeof ARTIGOS!=='undefined'&&ARTIGOS[k]&&!ARTIGOS[k].falta)||temasDe(k).length>0;
/* nome da lei escrito no texto → sigla da chave */
function sigDe(n){if(!n)return null;n=n.replace(/^\s*,?\s*(?:(?:do|da)\s+)?/i,'').trim();
 let m=n.match(/^Lei(?:\s+nº)?\s*([\d.]+)\/\d+/i);if(m)return 'L'+m[1].replace(/\./g,'');m=n.match(/^LC\s*(\d+)/i);if(m)return 'LC'+m[1];
 if(/^(CPP|Código de Processo Penal)/i.test(n))return 'CPP';if(/^(CP|Código Penal)/i.test(n))return 'CP';if(/^(CF|Constituição)/i.test(n))return 'CF';
 return ({ECA:'L8069',LEP:'L7210',CTN:'L5172'})[n.slice(0,3).toUpperCase()]||null}
/* artigo sem lei escrita: decide pelo contexto do passo (chips) e pelos temas da peça; ambíguo, não liga */
function resolver(num,ctx){const c=[...new Set(ctx.filter(k=>k.split(':')[1]===num))];if(c.length===1)return c[0];
 const t=[...new Set(temasDaPeca().flatMap(x=>(x.lei||[]).map(base)).filter(k=>k.split(':')[1]===num))];return t.length===1?t[0]:null}
const LEI_RX='(?:Código de Processo Penal|Código Penal|Constituição(?: Federal)?|CPP|CP|CF|ECA|LEP|CTN|Lei(?: nº)?\\s*[\\d.]+\\/\\d+|LC\\s*\\d+(?:\\/\\d+)?)';
const RX_ART=new RegExp('(?:\\b('+LEI_RX+')\\s*,\\s*)?\\barts?\\.\\s*((?:§\\s*)?\\d+\\s*[º°]?(?:-[A-Z])?(?:\\s*(?:,|\\be\\b)\\s*(?:§\\s*\\d+\\s*[º°]?(?:-[A-Z])?|[IVXL]+\\b|parágrafo único|caput|\\d+\\s*[º°]?(?:-[A-Z])?(?![\\d/])))*)(\\s*,?\\s*(?:(?:do|da)\\s+'+LEI_RX+'|(?:CPP|CP|CF)\\b(?!\\s*,\\s*arts?\\.)))?','g');
const RX_SUM=/\b(?:Súmula|Súm\.)\s+(Vinculante\s+)?(?:nº\s*)?(\d+)(\s*,?\s*(?:do|da)\s+(STF|STJ))?|\bSV\s*(\d+)/gi;
/* termos de conceito: o título do tema (antes de ':' ou '(') e expressões fixas da doutrina de cada tema */
const TERMOS_EXTRA={preventiva:['fumus comissi delicti','periculum libertatis','garantia da ordem pública','conveniência da instrução criminal'],
 cautelares:['medidas cautelares diversas'],temporaria:['prisão temporária'],flagrante:['audiência de custódia','prisão em flagrante'],
 busca:['busca e apreensão','mandado de busca'],interceptacao:['interceptação telefônica','interceptação telemática','interceptação das comunicações'],
 'cadeia-custodia':['cadeia de custódia','exame de corpo de delito'],reconhecimento:['reconhecimento de pessoas','reconhecimento pessoal'],
 'direitos-fundamentais':['reserva de jurisdição','direitos fundamentais absolutos','direito fundamental absoluto'],
 orcrim:['organização criminosa'],trafico:['tráfico de drogas','associação para o tráfico'],lavagem:['lavagem de dinheiro'],
 infiltracao:['infiltração de agentes','ação controlada','colaboração premiada'],captacao:['captação ambiental'],
 'sigilo-bancario':['sigilo bancário','sigilo fiscal'],assecuratorias:['sequestro de bens','medidas assecuratórias','alienação antecipada','arresto'],
 inquerito:['inquérito policial','indiciamento'],'violencia-domestica':['medidas protetivas','Maria da Penha'],coacao:['coação no curso do processo'],
 'extorsao-sequestro':['extorsão mediante sequestro'],identificacao:['identificação criminal','perfil genético'],eca:['ato infracional','internação provisória']};
function termos(){const L=[];for(const t of temasDaPeca()){const tit=t.t.split(/[:(]/)[0].trim();
 const xs=[...(tit.split(' ').length<=6?[tit]:[]),...(TERMOS_EXTRA[t.k]||[])];for(const x of xs)if(x.length>=5)L.push([x,t.k])}
 return L.sort((a,b)=>b[0].length-a[0].length)}
const rxEsc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
/* todas as chaves de artigo com a lei escrita num texto ('CP, arts. 14, 29 e 71' → CP:14, CP:29, CP:71) */
function chavesTexto(txt){const K=[];let m;RX_ART.lastIndex=0;while((m=RX_ART.exec(String(txt||'')))){const sig=sigDe(m[1])||sigDe(m[3]);if(!sig)continue;
 let q;const rn=/(§\s*)?(\d+)\s*[º°]?(-[A-Z])?/g;while((q=rn.exec(m[2])))if(!q[1])K.push(sig+':'+q[2]+(q[3]||''))}return K}
const ctxDe=arts=>[...new Set((arts||[]).flatMap(chavesTexto))];
/* texto puro → HTML com links; ctx = chaves dos artigos do passo, para resolver "art. 313" sem a lei escrita */
function ligar(txt,ctx){txt=String(txt||'');if(!txt||typeof TEMAS==='undefined')return esc(txt);ctx=ctx||[];const M=[];let m;
 let ult=null;RX_ART.lastIndex=0;while((m=RX_ART.exec(txt))){const ini=m.index,fim=ini+m[0].length,sig=sigDe(m[1])||sigDe(m[3]);if(sig)ult=sig;
  const g2=m[2],o2=ini+m[0].indexOf(g2,m[1]?m[1].length:0),partes=[];let q;const rn=/(§\s*)?(\d+)\s*[º°]?(-[A-Z])?/g;
  while((q=rn.exec(g2))){if(q[1])continue;const nu=q[2]+(q[3]||''),k=sig?sig+':'+nu:(ult&&temArt(ult+':'+nu)?ult+':'+nu:resolver(nu,ctx));if(k&&temArt(k))partes.push([o2+q.index,o2+q.index+q[0].length,k])}
  if(partes.length){partes[0][0]=ini+(m[1]?m[0].indexOf('art'):0);M.push({ini,fim,partes})}}
 RX_SUM.lastIndex=0;while((m=RX_SUM.exec(txt))){let ref;if(m[1]||m[5])ref='SV-'+(m[2]||m[5]);
  else{const n=m[2],tri=m[4]&&m[4].toUpperCase(),c=['STF','STJ'].filter(x=>typeof JURIS!=='undefined'&&JURIS['SUM-'+x+'-'+n]);ref=tri?'SUM-'+tri+'-'+n:c.length===1?'SUM-'+c[0]+'-'+n:null}
  if(ref&&((typeof JURIS!=='undefined'&&JURIS[ref])||temasDe(ref).length))M.push({ini:m.index,fim:m.index+m[0].length,ref})}
 const usados=new Set();for(const [x,k] of termos()){if(usados.has(k+'|'+x))continue;const r=new RegExp('(^|[^\\p{L}])('+rxEsc(x)+')(?![\\p{L}])','giu');
  while((m=r.exec(txt))){const ini=m.index+m[1].length;M.push({ini,fim:ini+m[2].length,tema:k,c:1});usados.add(k+'|'+x);break}}
 M.sort((a,b)=>a.ini-b.ini||(b.fim-b.ini)-(a.fim-a.ini)||(a.c?1:0)-(b.c?1:0));
 let out='',p=0;for(const x of M){if(x.ini<p)continue;out+=esc(txt.slice(p,x.ini));
  if(x.partes){let q=x.ini;for(const [a,b,k] of x.partes){out+=esc(txt.slice(q,a))+`<a class="lk" tabindex="0" role="button" data-lk="art|${k}" title="Abrir: ${esc(rotulo(k))}">${esc(txt.slice(a,b))}</a>`;q=b}out+=esc(txt.slice(q,x.fim))}
  else if(x.ref)out+=`<a class="lk lk-s" tabindex="0" role="button" data-lk="jur|${x.ref}" title="Abrir: ${esc(rotulo(x.ref))}">${esc(txt.slice(x.ini,x.fim))}</a>`;
  else out+=`<a class="lk lk-c" tabindex="0" role="button" data-lk="tema|${x.tema}" title="Abrir no Estudo completo: ${esc(TEMAS[x.tema].t)}">${esc(txt.slice(x.ini,x.fim))}</a>`;
  p=x.fim}
 return out+esc(txt.slice(p))}
/* a tela que o link abre */
function abrirSobre(tipo,ref){let tit,h;
 if(tipo==='tema'){const t={k:ref,...TEMAS[ref]};tit='📚 '+t.t;h=`<p class="cont">Do Estudo completo · ${esc(t.area)}</p>${temaHTML(t)}`}
 else{const ts=temasDe(ref);tit=(tipo==='jur'?'⚖️ ':'📖 ')+rotulo(ref);
  h=`<div class="rot">${tipo==='jur'?'⚖️ Súmula (texto oficial)':'📖 Letra da lei (redação oficial)'}</div>${leiHTML(ref,1)}
  ${ts.length?`<div class="rot" style="margin-top:16px">📚 No Estudo completo${ts.some(t=>temasDaPeca().some(x=>x.k===t.k))?' desta peça':''}</div>${ts.map(t=>temaHTML(t,[ref])).join('')}`:'<p class="cont">Este dispositivo não tem tema próprio no Estudo completo; acima, a letra da lei.</p>'}`}
 $('sobreTit').textContent=tit;$('sobreCorpo').innerHTML=h;const o=$('sobre');o.hidden=false;o.scrollTop=0;$('sobreX').focus()}
const fecharSobre=()=>{const o=$('sobre');if(o&&!o.hidden){o.hidden=true;const v=document.querySelector('[data-lk].foco');if(v){v.classList.remove('foco');v.focus()}}};
document.addEventListener('click',e=>{if(e.target.id==='sobreX'||e.target.id==='sobre')return fecharSobre();const a=e.target.closest('[data-lk]');if(!a)return;e.preventDefault();

/* a faixa do passo: os temas do Estudo completo ligados ao que este passo cita */

 const ks=ts.filter(t=>(t.lei||[]).some(r=>ctx.includes(base(r))||h.includes('art|'+base(r)+'"'))||(t.jur||[]).some(r=>h.includes('jur|'+r+'"'))||h.includes('tema|'+t.k+'"'));
